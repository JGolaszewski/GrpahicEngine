site_name: GraphicEngine Documentation
site_description: Architecture, workflows, and API reference for GraphicEngine.
docs_dir: docs
site_dir: out/docs/site
strict: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdoxy:
      projects:
        engineApi:
          src-dirs: GraphicEngineCore/modules GraphicEngineEditor/modules GraphicEngineBackends/D3D11/include
          doxy-cfg-file: Doxyfile
          full-doc: true
          doxy-cfg:
            FILE_PATTERNS: "*.h *.hpp"
            EXCLUDE_PATTERNS: "*/src/* */tests/* */vendor/*"
            PREDEFINED: "ENGINE_API="
            GENERATE_HTML: NO
            GENERATE_XML: YES
            WARN_IF_UNDOCUMENTED: YES
            WARN_NO_PARAMDOC: NO
            WARN_IF_DOC_ERROR: YES
            WARN_AS_ERROR: YES

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path:
        - scripts
        - GraphicEngineCore/modules
        - GraphicEngineEditor/modules
        - GraphicEngineBackends/D3D11
        - SandboxApp
      check_paths: true
      restrict_base_path: true

nav:
  - Home: index.md
  - Architecture and guides:
      - Architecture: architecture.md
      - Editor guide: editor-guide.md
      - Asset pipeline: asset-pipeline.md
      - C++ guidelines: cpp-guidelines.md
      - Logging: logging.md
      - Editor settings: editor-settings.md
      - Rendering:
          - Pipeline: rendering/pipeline.md
          - Cameras: rendering/cameras.md
          - Editor render panel: rendering/editor-render-panel.md
          - Render output and image export: rendering/output.md
          - Shadows: rendering/shadows.md
          - Final rendering: rendering/final-render.md
          - Environment lighting: rendering/environment-lighting.md
  - Workflows:
      - Getting started: getting-started.md
      - Development workflow: development-workflow.md
      - Editor workflows: editor-workflows.md
      - Testing: testing.md
      - Windows validation: validation/windows.md
      - Profiling, debugging, and QA: profiling-qa.md
  - Engine API:
      - Overview: api-reference.md
      - API index: engineApi/links.md
      - Classes: engineApi/annotated.md
      - Class index: engineApi/classes.md
      - Class hierarchy: engineApi/hierarchy.md
      - Class members: engineApi/class_members.md
      - Namespaces: engineApi/namespaces.md
      - Functions: engineApi/functions.md
      - Files: engineApi/files.md
