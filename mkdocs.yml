site_name: GraphicEngine Documentation
site_description: Architecture, workflows, and API reference for GraphicEngine.
docs_dir: docs
site_dir: out/docs/site
strict: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdoxy:
      projects:
        coreApi:
          src-dirs: GraphicEngineCore/modules
          doxy-cfg-file: Doxyfile
          full-doc: true
          doxy-cfg:
            FILE_PATTERNS: "*.h *.hpp"
            EXCLUDE_PATTERNS: "*/src/* */tests/* */vendor/*"
            PREDEFINED: "ENGINE_API="
            GENERATE_HTML: NO
            GENERATE_XML: YES
            WARN_IF_UNDOCUMENTED: YES
            WARN_NO_PARAMDOC: YES
            WARN_IF_DOC_ERROR: YES
            WARN_AS_ERROR: YES

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - scripts
        - GraphicEngineCore/modules
        - GraphicEngineEditor/modules
        - GraphicEngineBackends/D3D11
        - SandboxApp
      check_paths: true
      restrict_base_path: true

nav:
  - Home: index.md
  - Architecture and guides:
      - C++ guidelines: cpp-guidelines.md
      - Logging: logging.md
      - Rendering:
          - Cameras: rendering/cameras.md
          - Editor render panel: rendering/editor-render-panel.md
          - Render output and image export: rendering/output.md
          - Shadows: rendering/shadows.md
          - Final rendering: rendering/final-render.md
  - Workflows:
      - Development workflow: development-workflow.md
      - Testing: testing.md
      - Windows validation: validation/windows.md
  - Core API:
      - Overview: api-reference.md
      - API index: coreApi/links.md
      - Classes: coreApi/annotated.md
      - Class index: coreApi/classes.md
      - Class hierarchy: coreApi/hierarchy.md
      - Class members: coreApi/class_members.md
      - Namespaces: coreApi/namespaces.md
      - Functions: coreApi/functions.md
      - Files: coreApi/files.md
